[package]
name = "shark-dpi-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Read-only HID probe and offline X8 SE DPI codec research"
license = "MIT"

[[bin]]
name = "AttackSharkDPI"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
